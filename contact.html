<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Bayu Hadi Nugraha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
```
<nav class="navbar">
    <h2>My Portfolio</h2>
    <div class="nav-menu">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>
    <button id="darkModeBtn">🌙 Dark Mode</button>
</nav>
<section class="contact">
    <h1>Kontak Saya</h1>
    <p>Silakan hubungi saya melalui kontak berikut.</p>
    <div class="contact-card">
        <div class="contact-item">
            <h3>Email</h3>
            <p>bayuhadinugraha498@gmail.com</p>
        </div>
        <div class="contact-item">
            <h3>Instagram</h3>
            <p>@besttboyy54321</p>
        </div>
        <div class="contact-item">
            <h3>WhatsApp</h3>
            <p>+62 812-3194-3313</p>
        </div>
        <div class="contact-item">
            <h3>Alamat</h3>
            <p>Surabaya, Jawa Timur</p>
        </div>
    </div>
    <div class="contact-form">
        <h2>Kirim Pesan</h2>
        <form id="contactForm">
            <label for="nama">Nama</label>
            <input 
                type="text" 
                id="nama" 
                placeholder="Masukkan nama"
            >
            <label for="email">Email</label>
            <input 
                type="email" 
                id="email" 
                placeholder="Masukkan email"
            >
            <label for="pesan">Pesan</label>
            <textarea 
                id="pesan" 
                placeholder="Masukkan pesan"
            ></textarea>
            <button type="submit">Kirim</button>
        </form>
        <p id="notifikasi"></p>
    </div>
</section>
<script>
    const form = document.getElementById("contactForm");
    const notifikasi = document.getElementById("notifikasi");
    form.addEventListener("submit", function(event) {
        event.preventDefault();
        const nama = document.getElementById("nama").value.trim();
        const email = document.getElementById("email").value.trim();
        const pesan = document.getElementById("pesan").value.trim();
        if (nama !== "" && email !== "" && pesan !== "") {
            notifikasi.textContent = "Pesan berhasil dikirim";
            notifikasi.className = "success";
            form.reset();
        } else {

            notifikasi.textContent = "Semua input harus diisi!";
            notifikasi.className = "error";
        }
    });
    const darkModeBtn = document.getElementById("darkModeBtn");
    darkModeBtn.addEventListener("click", function() {
        document.body.classList.toggle("dark-mode");
        if (document.body.classList.contains("dark-mode")) {
            darkModeBtn.textContent = "☀️ Light Mode";
        } else {
            darkModeBtn.textContent = "🌙 Dark Mode";
        }
    });
</script>
</body>
</html>
