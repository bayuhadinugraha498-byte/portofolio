<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Bayu Hadi Nugraha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h2>my Portfolio</h2>
        <div class="nav-menu">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
        <button id="darkModeBtn">🌙 Dark Mode</button>
    </nav>
    <section class="about">
        <div class="about-photo">
    <img id="fotoProfil" src="foto.jpg" alt="Foto Bayu Hadi Nugraha">

    <div class="foto-button">
        <button id="sembunyikanBtn">Sembunyikan Foto</button>
        <button id="tampilkanBtn">Tampilkan Foto</button>
    </div>
</div>
        <div class="about-text">
            <h1>Tentang Saya</h1>
            <p>
                Halo, saya Bayu Hadi Nugraha. Saya merupakan mahasiswa
                D4 Manajemen Informatika yang tertarik pada dunia teknologi
                informasi dan pengembangan website.
            </p>
            <h3>Keahlian</h3>
            <ul>
                <li>HTML & CSS</li>
                <li>Python</li>
                <li>Database MySQL</li>
            </ul>
        </div>
    </section>
<script>
    const darkModeBtn = document.getElementById("darkModeBtn");
    darkModeBtn.addEventListener("click", function() {
        document.body.classList.toggle("dark-mode");
        if (document.body.classList.contains("dark-mode")) {
            darkModeBtn.textContent = "☀️ Light Mode";
        } else {
            darkModeBtn.textContent = "🌙 Dark Mode";
        }
    });
    const fotoProfil = document.getElementById("fotoProfil"); 
    const sembunyikanBtn = document.getElementById("sembunyikanBtn"); 
    const tampilkanBtn = document.getElementById("tampilkanBtn");
    // Tombol Sembunyikan Foto 
    sembunyikanBtn.addEventListener("click", function() {
    fotoProfil.style.display = "none"; 
    });
    // Tombol Tampilkan Foto 
    tampilkanBtn.addEventListener("click", function() { 
    fotoProfil.style.display = "block"; 
    });
</script>
</body>
</html>
